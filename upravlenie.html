<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Управление ДФ</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#F0ECE1;
    --border:#DAD4C3; --text:#2B2B26; --text-muted:#6B6B63;
    --green:#4F6F5C; --green-light:#E9EFEA;
    --gold:#B08A4E; --gold-light:#F6EFE1;
    --danger:#A5473A; --danger-light:#F5E8E5;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1C18; --surface:#262621; --surface-2:#2E2E27;
      --border:#44443A; --text:#EDEAE0; --text-muted:#A7A398;
      --green-light:#2B3A32; --gold-light:#3A3324;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1C18; --surface:#262621; --surface-2:#2E2E27;
    --border:#44443A; --text:#EDEAE0; --text-muted:#A7A398;
    --green-light:#2B3A32; --gold-light:#3A3324;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:640px; margin:0 auto; padding:14px 14px 110px;}
  .eyebrow{font-size:11px; letter-spacing:.08em; font-weight:700; color:var(--gold); text-transform:uppercase;}
  h1{font-size:19px; margin:4px 0 10px;}

  .tabbar{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--surface-2); color:var(--text-muted); cursor:pointer; border:1px solid var(--border);
    white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  .tab.active{background:var(--green); color:#fff; border-color:var(--green);}
  .tab .x{opacity:.7; font-size:11px;}
  .tab-add{flex:0 0 auto; padding:7px 12px; border-radius:999px; font-size:15px; font-weight:700;
    background:transparent; color:var(--gold); border:1px dashed var(--border); cursor:pointer;}

  input[type=text], textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:6px 8px; font-size:13.5px; color:var(--text); font-family:inherit;
  }
  textarea{resize:vertical; min-height:36px;}
  label{display:block; font-size:11px; font-weight:600; color:var(--gold); margin-bottom:3px; text-transform:uppercase; letter-spacing:.03em;}
  .field{margin-bottom:8px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .iconbtn{border:none; background:transparent; color:var(--text-muted); font-size:13px; padding:5px 6px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .iconbtn.add{color:var(--green);}
  .iconbtn.del{color:var(--danger);}
  .iconbtn:active{background:var(--surface-2);}

  /* employees */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .card-top{display:flex; gap:8px; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .spheres-title{font-size:13px; font-weight:700; color:var(--green); margin:12px 0 6px;}
  .sphere{background:var(--green-light); border-radius:8px; padding:10px; margin-bottom:8px;}
  .sphere-head{display:flex; gap:6px; justify-content:space-between; align-items:center; margin-bottom:6px;}

  /* tree */
  .node{border-radius:9px; margin-bottom:7px; border:1px solid var(--border); overflow:hidden;}
  .node-head{display:flex; gap:6px; align-items:center; padding:7px 8px; background:var(--surface);}
  .node-head input{flex:1;}
  .node-notes{padding:0 8px 8px;}
  .node-children{padding:0 0 8px 16px; border-left:2px solid var(--border); margin-left:12px;}
  .toplevel > .node-head{background:var(--green);}
  .toplevel > .node-head input{color:#fff; font-weight:700; background:transparent; border-color:transparent;}
  .toplevel > .node-head .iconbtn{color:#fff;}
  .toggle{cursor:pointer; font-size:12px; color:var(--text-muted); padding:2px 4px;}

  .addbtn, .addroot, .add-employee{
    width:100%; border:1px dashed var(--border); background:transparent; color:var(--text-muted);
    border-radius:9px; padding:11px; font-size:13.5px; cursor:pointer; margin-top:6px;
  }
  .add-employee{border-style:solid; background:var(--green); color:#fff; font-weight:700; border-color:var(--green);}
  .addbtn:active, .addroot:active{background:var(--surface-2);}
  .empty{text-align:center; color:var(--text-muted); font-size:13px; padding:30px 10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">TAJWEED INSTITUTE</div>
  <h1>Управление ДФ — конструктор</h1>
  <div class="tabbar" id="tabbar"></div>
  <div id="content"></div>
</div>
<script>
const KEY = "tajweed_org_combined_v1";
const OLD_EMP_KEY = "tajweed_org_employees_v1";
const OLD_TREE_KEY = "tajweed_org_structure_v1";
let state;

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

// ---- tree node helpers ----
function tnode(title, children, notes){ return { id: uid(), title: title||"", notes: notes||"", children: children||[], collapsed:false }; }
function findNode(list, id){ for(const n of list){ if(n.id===id) return n; const f=findNode(n.children,id); if(f) return f; } return null; }
function removeNode(list, id){ const i=list.findIndex(n=>n.id===id); if(i>-1){list.splice(i,1); return true;} for(const n of list){ if(removeNode(n.children,id)) return true; } return false; }

// ---- employee helpers ----
function emptyEmployee(){ return { id: uid(), position:"", name:"", reportsTo:"", contact:"", spheres:[emptySphere()] }; }
function emptySphere(){ return { id: uid(), title:"", items:"", details:"" }; }

function seedStructureTree(){
  const stdSet = () => [
    tnode("Экзамены"), tnode("Каникулы"), tnode("Замены учителя"),
    tnode("Группы"), tnode("Подгруппы для учеников"), tnode("Оплаты"),
    tnode("Переходы из групп"), tnode("Зачеты"), tnode("Программы курса"),
    tnode("Учебный план"),
  ];
  return [
    tnode("Школа ДФ", [ tnode("Продвинутый курс", stdSet()), tnode("Курс от А до Я", stdSet()) ]),
    tnode("Институт ДФ", [ tnode("Дипломная работа", stdSet()) ]),
    tnode("Матн", [ tnode("Учебный план") ]),
    tnode("Индивидуальные уроки", [ tnode("Учебный план") ]),
    tnode("Тасхих", [ tnode("Учебный план") ]),
    tnode("Курсы дополнительные", [ tnode("Новые уроки для учителей"), tnode("Зачеты") ]),
  ];
}

function defaultState(){
  return {
    activeId: "emp",
    tabs: [
      { id:"emp", name:"Сотрудники", type:"employees", employees:[ emptyEmployee() ] },
      { id:"str", name:"Структура", type:"tree", tree: seedStructureTree() },
    ],
  };
}

function tryMigrate(){
  // best-effort import of data from the two earlier standalone pages, if present on the same origin
  const s = defaultState();
  try{
    const oldEmp = localStorage.getItem(OLD_EMP_KEY);
    if(oldEmp){ const arr = JSON.parse(oldEmp); if(Array.isArray(arr) && arr.length) s.tabs[0].employees = arr; }
  }catch(e){}
  try{
    const oldTree = localStorage.getItem(OLD_TREE_KEY);
    if(oldTree){ const arr = JSON.parse(oldTree); if(Array.isArray(arr) && arr.length) s.tabs[1].tree = arr; }
  }catch(e){}
  return s;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : tryMigrate();
  }catch(e){ state = defaultState(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function activeTab(){ return state.tabs.find(t => t.id === state.activeId) || state.tabs[0]; }

// ---------- render: tabbar ----------
function renderTabbar(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  state.tabs.forEach(t => {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === state.activeId ? " active" : "");
    el.innerHTML = `<span data-action="select" data-id="${t.id}">${esc(t.name)}</span>` +
      (state.tabs.length > 1 ? `<span class="x" data-action="del-tab" data-id="${t.id}">✕</span>` : "");
    bar.appendChild(el);
  });
  const addBtn = document.createElement("div");
  addBtn.className = "tab-add";
  addBtn.textContent = "+";
  addBtn.dataset.action = "add-tab";
  bar.appendChild(addBtn);
}

// ---------- render: employees tab ----------
function renderEmployees(tab){
  const wrap = document.createElement("div");
  if(tab.employees.length === 0){
    const e = document.createElement("div"); e.className="empty"; e.textContent="Пока нет ни одного сотрудника.";
    wrap.appendChild(e);
  }
  tab.employees.forEach((emp, idx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="eyebrow" style="font-size:11px;">СОТРУДНИК ${idx+1}</div>
        <button class="iconbtn del" data-action="del-emp" data-tab="${tab.id}" data-id="${emp.id}">Удалить ✕</button>
      </div>
      <div class="grid2">
        <div class="field"><label>Должность</label><input type="text" data-field="position" data-tab="${tab.id}" data-id="${emp.id}" value="${esc(emp.position)}"></div>
        <div class="field"><label>Имя</label><input type="text" data-field="name" data-tab="${tab.id}" data-id="${emp.id}" value="${esc(emp.name)}"></div>
        <div class="field"><label>Кому подчиняется</label><input type="text" data-field="reportsTo" data-tab="${tab.id}" data-id="${emp.id}" value="${esc(emp.reportsTo)}"></div>
        <div class="field"><label>Куда направлять вопросы</label><input type="text" data-field="contact" data-tab="${tab.id}" data-id="${emp.id}" value="${esc(emp.contact)}"></div>
      </div>
      <div class="spheres-title">Сферы ответственности</div>
      <div class="spheres" data-emp="${emp.id}"></div>
      <button class="addbtn" data-action="add-sphere" data-tab="${tab.id}" data-id="${emp.id}">+ добавить сферу</button>
    `;
    const spheresWrap = card.querySelector(".spheres");
    emp.spheres.forEach(sp => {
      const sEl = document.createElement("div");
      sEl.className = "sphere";
      sEl.innerHTML = `
        <div class="sphere-head"><label style="margin:0;">Сфера</label>
          <button class="iconbtn del" data-action="del-sphere" data-tab="${tab.id}" data-emp="${emp.id}" data-sphere="${sp.id}">✕</button></div>
        <div class="field"><input type="text" data-sfield="title" data-tab="${tab.id}" data-emp="${emp.id}" data-sphere="${sp.id}" value="${esc(sp.title)}"></div>
        <div class="field"><label>Что входит</label><textarea data-sfield="items" data-tab="${tab.id}" data-emp="${emp.id}" data-sphere="${sp.id}">${esc(sp.items)}</textarea></div>
        <div class="field" style="margin-bottom:0;"><label>Детали / статус</label><input type="text" data-sfield="details" data-tab="${tab.id}" data-emp="${emp.id}" data-sphere="${sp.id}" value="${esc(sp.details)}"></div>
      `;
      spheresWrap.appendChild(sEl);
    });
    wrap.appendChild(card);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "add-employee"; addBtn.textContent = "+ Добавить сотрудника";
  addBtn.dataset.action = "add-emp"; addBtn.dataset.tab = tab.id;
  wrap.appendChild(addBtn);
  return wrap;
}

// ---------- render: tree tab ----------
function renderTreeNode(n, tabId, depth){
  const el = document.createElement("div");
  el.className = "node" + (depth === 0 ? " toplevel" : "");
  const hasKids = n.children.length > 0;
  el.innerHTML = `
    <div class="node-head">
      ${hasKids ? `<span class="toggle" data-action="toggle" data-tab="${tabId}" data-id="${n.id}">${n.collapsed ? "▸" : "▾"}</span>` : ""}
      <input type="text" data-field="title" data-tab="${tabId}" data-id="${n.id}" value="${esc(n.title)}" placeholder="название ветки">
      <button class="iconbtn add" data-action="add-child" data-tab="${tabId}" data-id="${n.id}">+ ветка</button>
      <button class="iconbtn del" data-action="del-node" data-tab="${tabId}" data-id="${n.id}">✕</button>
    </div>
    <div class="node-notes"><textarea data-field="notes" data-tab="${tabId}" data-id="${n.id}" placeholder="что входит / доработать / изменить">${esc(n.notes)}</textarea></div>
  `;
  if(hasKids && !n.collapsed){
    const cw = document.createElement("div"); cw.className = "node-children";
    n.children.forEach(c => cw.appendChild(renderTreeNode(c, tabId, depth+1)));
    el.appendChild(cw);
  }
  return el;
}
function renderTree(tab){
  const wrap = document.createElement("div");
  tab.tree.forEach(n => wrap.appendChild(renderTreeNode(n, tab.id, 0)));
  const addBtn = document.createElement("button");
  addBtn.className = "addroot"; addBtn.textContent = "+ добавить ветку верхнего уровня";
  addBtn.dataset.action = "add-root"; addBtn.dataset.tab = tab.id;
  wrap.appendChild(addBtn);
  return wrap;
}

function render(){
  renderTabbar();
  const content = document.getElementById("content");
  content.innerHTML = "";
  const tab = activeTab();
  if(!tab) return;
  content.appendChild(tab.type === "employees" ? renderEmployees(tab) : renderTree(tab));
}

// ---------- events ----------
document.addEventListener("input", (e) => {
  const t = e.target;
  const tab = state.tabs.find(x => x.id === t.dataset.tab);
  if(!tab) return;
  if(tab.type === "employees"){
    if(t.dataset.field){
      const emp = tab.employees.find(x => x.id === t.dataset.id);
      if(emp){ emp[t.dataset.field] = t.value; save(); }
    } else if(t.dataset.sfield){
      const emp = tab.employees.find(x => x.id === t.dataset.emp);
      const sp = emp && emp.spheres.find(x => x.id === t.dataset.sphere);
      if(sp){ sp[t.dataset.sfield] = t.value; save(); }
    }
  } else if(tab.type === "tree"){
    if(t.dataset.field){
      const n = findNode(tab.tree, t.dataset.id);
      if(n){ n[t.dataset.field] = t.value; save(); }
    }
  }
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action === "select"){ state.activeId = el.dataset.id; save(); render(); return; }
  if(action === "add-tab"){
    const name = prompt("Название новой вкладки:");
    if(name && name.trim()){
      const id = uid();
      state.tabs.push({ id, name: name.trim(), type:"tree", tree:[] });
      state.activeId = id; save(); render();
    }
    return;
  }
  if(action === "del-tab"){
    if(confirm("Удалить вкладку «" + (state.tabs.find(x=>x.id===el.dataset.id)||{}).name + "» со всем содержимым?")){
      state.tabs = state.tabs.filter(x => x.id !== el.dataset.id);
      if(state.activeId === el.dataset.id) state.activeId = state.tabs[0].id;
      save(); render();
    }
    return;
  }

  const tab = state.tabs.find(x => x.id === el.dataset.tab);
  if(!tab) return;

  if(action === "add-emp"){ tab.employees.push(emptyEmployee()); save(); render(); }
  else if(action === "del-emp"){
    if(confirm("Удалить этого сотрудника вместе со всеми сферами?")){
      tab.employees = tab.employees.filter(x => x.id !== el.dataset.id); save(); render();
    }
  }
  else if(action === "add-sphere"){
    const emp = tab.employees.find(x => x.id === el.dataset.id);
    if(emp){ emp.spheres.push(emptySphere()); save(); render(); }
  }
  else if(action === "del-sphere"){
    const emp = tab.employees.find(x => x.id === el.dataset.emp);
    if(emp){ emp.spheres = emp.spheres.filter(x => x.id !== el.dataset.sphere); save(); render(); }
  }
  else if(action === "add-root"){ tab.tree.push(tnode("")); save(); render(); }
  else if(action === "add-child"){
    const n = findNode(tab.tree, el.dataset.id);
    if(n){ n.children.push(tnode("")); n.collapsed = false; save(); render(); }
  }
  else if(action === "del-node"){
    const n = findNode(tab.tree, el.dataset.id);
    const msg = n && n.children.length ? "Удалить эту ветку вместе со всеми подветками?" : "Удалить эту ветку?";
    if(confirm(msg)){ removeNode(tab.tree, el.dataset.id); save(); render(); }
  }
  else if(action === "toggle"){
    const n = findNode(tab.tree, el.dataset.id);
    if(n){ n.collapsed = !n.collapsed; render(); }
  }
});

load();
render();
</script>
</body>
</html>
